[package]
name = "wasmnet-app-kit"
version = "0.0.0"
description = "What an app needs besides its own logic: the bindings of world wasmnet:app/app, config keys, socket address conversions, error names and the body hash."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The standard WASI 0.3 socket types the apps use (for the address conversions).
wasip3 = { workspace = true, features = ["std"] }
# The apps' bindings (world `wasmnet:app/app`) are generated here; `run` is an async export.
wit-bindgen = { workspace = true, features = ["macros", "realloc", "async"] }

[lints]
workspace = true
