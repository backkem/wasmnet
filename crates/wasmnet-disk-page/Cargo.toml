[package]
name = "wasmnet-disk-page"
version = "0.0.0"
description = "The page's simulator module with disks in it: what an embedder builds to give its devices disks in a page (wasmnet_web::install)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `cargo build --release --target wasm32-unknown-unknown -p wasmnet-disk-page`: every export of
# `wasmnet-web`, plus `wn_install` and the disk exports below. A crate of its own (not an example
# of `wasmnet-disk`) so that nothing the disk's tests need is built for the page.
[lib]
crate-type = ["cdylib"]

[dependencies]
wasmnet-web = { path = "../wasmnet-web" }
wasmnet-disk = { path = "../wasmnet-disk" }

[lints]
workspace = true
