name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # The same bytes on every machine is the point: the tests pin capture and result hashes,
    # so they run on more than one operating system.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml: the pinned compiler, both wasm targets, rustfmt, clippy.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@v1.27.0
      # The pinned versions are in tools.toml; `cargo xtask tools` prints them as package@version.
      - name: Install wasmtime, wasm-tools and wac (pinned)
        shell: bash
        run: cargo binstall --no-confirm --locked $(cargo xtask tools)
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build and validate every component and node
        run: cargo xtask build
      - name: Native tests (wire, simulator, host, end to end)
        run: cargo test --workspace
      - name: Component tests, inside wasmtime
        run: cargo xtask test-guest
      - name: Docs
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
