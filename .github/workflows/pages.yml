name: Pages

# Builds the browser example (web/: the simulator for wasm32-unknown-unknown, the components the
# page runs, transpiled with the codelib-web kit, and the page) and tests it in headless Chromium
# against the native example. A push to main also deploys it to
# https://backkem.github.io/wasmnet/; a pull request only builds and tests.
#
# GitHub only runs workflows from the top of a repository, so this one starts working once this
# directory is the repository's root. Repository settings: Pages > Build and deployment >
# Source: GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One deployment at a time; a pull request only builds and tests, in a group of its own.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml: the pinned compiler and both wasm targets.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@v1.27.0
      # The pinned versions are in tools.toml; `cargo xtask tools` prints them as package@version.
      - name: Install wasm-tools and wac (pinned)
        run: cargo binstall --no-confirm --locked $(cargo xtask tools wasm-tools wac-cli)

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the components, the simulator and the page
        run: cargo xtask web

      - name: Install Chromium
        working-directory: web
        run: npx playwright-core install --with-deps chromium-headless-shell

      - name: The native example's journal and captures, to compare with
        run: cargo run -p wasmnet-host --example http > target/http-native.txt

      - name: Test the page
        working-directory: web
        run: npm test
        env:
          NATIVE_JOURNAL: ../target/http-native.txt

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
