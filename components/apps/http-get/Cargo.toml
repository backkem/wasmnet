[package]
name = "wasmnet-http-get"
version = "0.0.0"
description = "An HTTP/1.1 GET client as a WASI 0.3 app: fetches the URLs in its config over wasi:sockets TCP."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A wasmnet app (world `wasmnet:app/app`): an HTTP/1.1 GET client and an ordinary
# WASI 0.3 program. It fetches the URLs from its config over `wasi:sockets@0.3.0` TCP (optionally
# reusing one keep-alive connection), logs each response's status, headers, body size and body
# hash with connect / first-byte / done times on the virtual clock, and exits with a status.
# `src/lib.rs` is the pure logic (config, URLs, response parsing with `httparse`; guest-tested
# in wasmtime); `src/component.rs` is the glue.

[lib]
# The artifact is named after the component, not the package: `http_get.wasm`.
name = "http_get"
crate-type = ["cdylib"]

[dependencies]
# What the apps share: bindings, config keys, address conversions.
wasmnet-app-kit = { path = "../../../crates/wasmnet-app-kit" }
wasmnet-wire = { path = "../../../crates/wasmnet-wire" }
thiserror.workspace = true
httparse.workspace = true
# The `run` export is an async func; one task, so no spawn and no inter-task wakeup.
wit-bindgen = { workspace = true, features = ["macros", "realloc", "async"] }
# The standard WASI 0.3 bindings: sockets, name lookup and clocks, exactly as on any WASI host.
wasip3 = { workspace = true, features = ["std"] }

[lints]
workspace = true
