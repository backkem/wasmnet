[package]
name = "wasmnet-clock-probe"
version = "0.0.0"
description = "Test fixture: a std command that samples every source of time and entropy it can reach."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `src/main.rs` is a plain std `wasm32-wasip2` command (exports wasi:cli/run@0.2).
# `examples/async_probe.rs` is a p3 command (exports wasi:cli/run@0.3, async) built with
# wit-bindgen's async ABI via the `wasip3` crate; it is our wasmtime x wit-bindgen check.

# The artifact is named after the component, not the package: `clock-probe.wasm`.
[[bin]]
name = "clock-probe"
path = "src/main.rs"

[dependencies]
wasip2.workspace = true

[dev-dependencies]
wasip3.workspace = true
# `examples/ext_probe.rs`: imports a test-only host extension.
wit-bindgen = { workspace = true, features = ["macros", "realloc"] }

[[example]]
name = "async-probe"
path = "examples/async_probe.rs"
crate-type = ["cdylib"]

[[example]]
name = "ext-probe"
path = "examples/ext_probe.rs"

# `examples/disk_device.rs`: a stepped device (no ports) that imports a test-only disk, for the
# host's fault and extension tests.
[[example]]
name = "disk-device"
path = "examples/disk_device.rs"
crate-type = ["cdylib"]

# `examples/pad_probe.rs`: a stepped device (no ports) that keeps notes through a portable
# extension (`crates/wasmnet-pad`), for the tests of portable extensions on both backends.
[[example]]
name = "pad-probe"
path = "examples/pad_probe.rs"
crate-type = ["cdylib"]

# `examples/disk_probe.rs`: a stepped device (no ports) that keeps its state on two disks
# (`crates/wasmnet-disk`: wasi:keyvalue plus wasmnet:keyvalue-ext), for the disk tests on both
# backends.
[[example]]
name = "disk-probe"
path = "examples/disk_probe.rs"
crate-type = ["cdylib"]

# `examples/store_probe.rs`: a stepped device (no ports) that keeps its data through a contract of
# its own (`wit/test-store`), composed with `components/store-adapter` over its disks.
[[example]]
name = "store-probe"
path = "examples/store_probe.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
